const drafts={entry:{date:todayISO,kind:'vente',cat:'706',label:'',ht:'',rate:20,ttc:'',delay:0,dur:3,mode:'lin',rep:1},loan:{label:'',amount:'',rate:'',months:60,start:todayISO,deferred:0},eq:{label:'',type:'apport',amount:'',date:todayISO},need:{label:'',ht:'',rate:20}};

/* calculs */
function plan(e){const out={},n=Math.max(1,e.dur||1),[y0,m0]=dparts(e.date);let vnc=e.ht,rem=n*12,y=y0,first=true;

let carry=0,due=0;for(let m=0;m<12;m++){const bal=carry+R.vV[m]-(R.cvV[m]+R.cfV[m]+R.imV[m]);if(m<11){if(bal>0){R.pay[m+1]=bal;carry=0}else carry=bal}else due=Math.max(0,bal)}
R.due=due;return R}

function niceStep(x){const m=Math.pow(10,Math.floor(Math.log10(x||1))),r=x/m;return(r<=1?1:r<=2?2:r<=5?5:10)*m}
function lineChart(series,labels){const w=760,h=250,pd={l:64,r:14,t:12,b:26};const all=series.flatMap(s=>s.v);let mn=Math.min(0,...all),mx=Math.max(0,...all);if(mx===mn)mx=mn+1;
const st=niceStep((mx-mn)/4);mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
const X=i=>pd.l+(w-pd.l-pd.r)*i/(labels.length-1),Y=v=>pd.t+(h-pd.t-pd.b)*(1-(v-mn)/(mx-mn));let g='';
for(let v=mn;v<=mx+st/1000;v+=st)g+=`<line x1="${pd.l}" x2="${w-pd.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${Math.abs(v)<1e-9?'stroke-width="1.5"':''}/><text class="ax" x="${pd.l-6}" y="${Y(v)+4}" text-anchor="end">${n0(v)}</text>`;
labels.forEach((l,i)=>g+=`<text class="ax" x="${X(i)}" y="${h-8}" text-anchor="middle">${l}</text>`);
series.forEach(s=>{const d=s.v.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2"/><circle cx="${X(s.v.length-1)}" cy="${Y(s.v[s.v.length-1])}" r="4" fill="${s.c}"/>`});
return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="Graphique">${g}</svg>`}

function journal(y){const L=[];const push=(date,j,a,label,d,c)=>{if(+date.slice(0,4)===y&&(Math.abs(d)>0.004||Math.abs(c)>0.004))L.push({date,j,a,label,d,c})};
S.entries.forEach(e=>{const v=e.ht*e.rate/100,T=e.ht+v,pay=addDays(e.date,e.delay||0);
if(e.kind==='vente'){push(e.date,'VT','411',e.label,T,0);push(e.date,'VT',e.cat,e.label,0,e.ht);push(e.date,'VT','44571','TVA '+e.rate+' % – '+e.label,0,v);push(pay,'BQ','512',e.label,T,0);push(pay,'BQ','411',e.label,0,T)}
else{const tier=e.kind==='immo'?'404':'401',tv=e.kind==='immo'?'44562':'44566';push(e.date,'AC',e.cat,e.label,e.ht,0);push(e.date,'AC',tv,'TVA '+e.rate+' % – '+e.label,v,0);push(e.date,'AC',tier,e.label,0,T);push(pay,'BQ',tier,e.label,T,0);push(pay,'BQ','512',e.label,0,T)}});
S.loans.forEach(l=>{push(l.start,'BQ','512',l.label,l.amount,0);push(l.start,'BQ','164',l.label,0,l.amount);sched(l).forEach(r=>{push(r.date,'BQ','164',l.label+' – capital',r.capital,0);push(r.date,'BQ','661',l.label+' – intérêts',r.interest,0);push(r.date,'BQ','512',l.label+' – échéance',0,r.capital+r.interest)})});
S.equity.forEach(q=>{push(q.date,'BQ','512',q.label,q.amount,0);push(q.date,'BQ',{apport:'101',compte:'455',subvention:'131'}[q.type],q.label,0,q.amount)});
assets().forEach(({e,p})=>{const d=p[y]||0;push(y+'-12-31','OD','681','Dotation – '+e.label,d,0);push(y+'-12-31','OD',amAcc(e.cat),'Amortissement – '+e.label,0,d)});
return L.sort((a,b)=>a.date.localeCompare(b.date)||a.j.localeCompare(b.j))}

/* ===== SEUIL DE RENTABILITÉ ===== */
const ov=v=>v!==''&&v!=null&&!isNaN(v);
function srCalc(){const y=S.settings.year,s=yearStats(y),sr=S.sr;
const caH=ov(sr.ca)?+sr.ca:s.ca.h,kv=ratio(s.ca,1.2),cvR=ov(sr.cv)?sr.cv/100:(s.ca.h>0?s.cv.h/s.ca.h:0);
const cfAuto=padd(s.cf,s.dot,s.int),cfH=ov(sr.cf)?+sr.cf:cfAuto.h,kcf=ratio(cfAuto,1.2),kcv=ratio(s.cv,1.2);
const tm=1-cvR,SR=tm>0?cfH/tm:0;
return{s,caH,kv,cvR,cfH,kcf,kcv,tm,SR,CA:P(caH,caH*kv),CV:P(caH*cvR,caH*cvR*kcv),CF:P(cfH,cfH*kcf),SRp:P(SR,SR*kv)}}
function viewSR(){const c=srCalc(),y=S.settings.year,sr=S.sr;const marge=psub(c.CA,c.CV),sec=psub(c.CA,c.SRp);
let h=head('Seuil de rentabilité','Le chiffre d\'affaires à partir duquel votre entreprise ne perd plus d\'argent. Les champs vides reprennent vos pièces de '+y+'.');
h+=`<div class="card"><h2>Hypothèses (HT)</h2><div class="row">${fld('Chiffre d\'affaires HT (€)',bindIn('sr.ca',sr.ca,n0(c.s.ca.h)))}${fld('Coûts variables (% du CA)',bindIn('sr.cv',sr.cv,n2(c.cvR*100)))}${fld('Charges fixes HT (€ / an)',bindIn('sr.cf',sr.cf,n0(c.cfH)))}${fld('Prix de vente unitaire HT (€)',bindIn('sr.price',sr.price,'facultatif'))}</div><p class="note">Charges fixes = charges fixes saisies + amortissements + intérêts d'emprunt.</p></div>`;
if(c.tm<=0||c.cfH<=0){return h+'<div class="card">Saisissez du chiffre d\'affaires et des charges fixes pour calculer le seuil.</div>'}
const days=c.caH>0?Math.round(c.SR/c.caH*365):0,dt=new Date(Date.UTC(y,0,1));dt.setUTCDate(dt.getUTCDate()+days);
const p=+sr.price,pT=p*c.kv,qty=p>0?c.SR/p:0;
h+=`<div class="grid">${kpi('Seuil de rentabilité (CA)',c.SRp,'Taux de marge sur coûts variables : '+n2(c.tm*100)+' %')}${kpi('Chiffre d\'affaires prévu',c.CA)}${kpi('Marge de sécurité',sec,c.CA.h>0?'Indice de sécurité : '+n2(sec.h/c.CA.h*100)+' %':'')}${kpi('Charges fixes',c.CF)}</div>`;
h+=`<div class="two"><div class="card"><h2>Point mort</h2><p style="margin:0">${c.caH>0?(days<=365?`Seuil atteint en <b>${days} jours</b>, soit vers le <b>${fdate(dt.toISOString().slice(0,10))}</b>, au rythme prévu.`:`Au rythme prévu, le seuil n'est pas atteint dans l'année (${days} jours).`):'Aucun chiffre d\'affaires prévu.'}</p>${p>0?`<p>Prix unitaire : <b class="num" style="color:var(--ht)">${e2(p)} HT</b> · <b class="num" style="color:var(--ttc)">${e2(pT)} TTC</b><br>À vendre pour atteindre le seuil : <b>${n0(Math.ceil(qty))}</b> unités par an, soit <b>${n0(Math.ceil(qty/12))}</b> par mois.</p>`:''}</div>
<div class="card"><h2>Détail</h2><table class="t"><thead><tr><th class="l">Poste</th><th>HT</th><th>TTC</th></tr></thead><tbody>${[['Chiffre d\'affaires',c.CA],['Coûts variables',c.CV],['Marge sur coûts variables',marge],['Charges fixes',c.CF],['Résultat prévu',psub(marge,c.CF)]].map(([l,q])=>`<tr><td class="l">${l}</td><td class="num" style="color:var(--ht)">${n0(q.h)}</td><td class="num" style="color:var(--ttc)">${n0(q.t)}</td></tr>`).join('')}</tbody></table></div></div>`;
h+=`<div class="card"><h2>Graphique du seuil</h2><div class="legend"><span><b style="background:var(--ht)"></b>Chiffre d'affaires</span><span><b style="background:var(--warn)"></b>Coûts totaux</span><span><b style="background:var(--muted)"></b>Charges fixes</span></div>${srChart(c)}</div>`;
return h}
function srChart(c){const w=760,h=270,pd={l:56,r:16,t:14,b:46};const xm=Math.max(c.caH,c.SR)*1.3,ym=Math.max(xm,c.cfH+c.cvR*xm)*1.05;
const X=v=>pd.l+(w-pd.l-pd.r)*v/xm,Y=v=>pd.t+(h-pd.t-pd.b)*(1-v/ym);let g='';
for(let i=0;i<=4;i++){const v=xm*i/4;g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${pd.t}" y2="${h-pd.b}" stroke="var(--line)"/><text class="ax" x="${X(v)}" y="${h-pd.b+14}" text-anchor="middle" style="fill:var(--ht)">${n0(v)}</text><text class="ax" x="${X(v)}" y="${h-pd.b+28}" text-anchor="middle" style="fill:var(--ttc)">${n0(v*c.kv)}</text>`}
for(let i=0;i<=4;i++){const v=ym*i/4;g+=`<line x1="${pd.l}" x2="${w-pd.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text class="ax" x="${pd.l-6}" y="${Y(v)+4}" text-anchor="end">${n0(v)}</text>`}
g+=`<text class="ax" x="${w-pd.r}" y="${h-2}" text-anchor="end">CA : HT (vert) / TTC (violet), en €</text>`;

function viewTre(){const y=S.settings.year,T=treasury(y),op=S.settings.opening;
const A=(f)=>Array.from({length:12},(_,i)=>f(i));
const vT=A(i=>T.vH[i]+T.vV[i]),cvT=A(i=>T.cvH[i]+T.cvV[i]),cfT=A(i=>T.cfH[i]+T.cfV[i]),imT=A(i=>T.imH[i]+T.imV[i]);
const inH=A(i=>T.vH[i]+T.eq[i]+T.li[i]),inT=A(i=>vT[i]+T.eq[i]+T.li[i]);
const outH=A(i=>T.cvH[i]+T.cfH[i]+T.imH[i]+T.cap[i]+T.int[i]),outT=A(i=>cvT[i]+cfT[i]+imT[i]+T.cap[i]+T.int[i]);
const nH=A(i=>inH[i]-outH[i]),nT=A(i=>inT[i]-outT[i]-T.pay[i]);
let a=op,b=op;const bH=nH.map(v=>a+=v),bT=nT.map(v=>b+=v);
const R=[['Encaissements clients',T.vH,vT],['Apports, comptes courants et subventions',T.eq,T.eq],['Emprunts reçus',T.li,T.li],['Total encaissements',inH,inT,'s'],['Charges variables',T.cvH,cvT],['Charges fixes',T.cfH,cfT],['Investissements',T.imH,imT],['Remboursement d\'emprunts (capital)',T.cap,T.cap],['Intérêts d\'emprunts',T.int,T.int],['Total décaissements',outH,outT,'s'],['TVA reversée à l\'État',Array(12).fill(0),T.pay],['Flux net du mois',nH,nT,'s'],['Trésorerie en fin de mois',bH,bT,'b']];
const minT=Math.min(...bT),mi=bT.indexOf(minT),minH=bH[bT.indexOf(minT)];
let h=head('Tableau de trésorerie','Mois par mois, à la date de règlement. Chaque cellule indique le HT (vert) puis le TTC (violet). La trésorerie réelle est la ligne TTC : elle tient compte de la TVA encaissée et reversée.');
h+=`<div class="grid">${kpi('Trésorerie fin '+y,P(bH[11],bT[11]),'Départ : '+e0(op))}${kpi('Point le plus bas ('+MONTHS[mi]+')',P(minH,minT),minT<0?'<span class="chip bad">Trésorerie négative</span>':'<span class="chip good">Toujours positive</span>')}<div class="kpi"><div class="kl">TVA à reverser en janvier ${y+1}</div><div class="kv"><span class="t">${e0(T.due)}</span></div></div></div>`;
h+=`<div class="card"><div class="legend"><span><b style="background:var(--ht)"></b>Solde HT</span><span><b style="background:var(--ttc)"></b>Solde TTC (réel)</span></div>${lineChart([{v:bH,c:'var(--ht)'},{v:bT,c:'var(--ttc)'}],MONTHS)}</div>`;
h+=`<div class="card"><div class="scroll"><table class="t wide"><thead><tr><th class="l">Montants en €</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead><tbody>`+R.map(([l,hh,tv,st])=>`<tr class="${st?'strong':''}"><td class="l">${l}${tags}</td>${hh.map((x,i)=>`<td class="${st&&(tv[i]<0||x<0)?'neg':''}">${dual(P(x,tv[i]))}</td>`).join('')}<td>${dual(st==='b'?P(hh[11],tv[11]):P(sum(hh),sum(tv)))}</td></tr>`).join('')+`</tbody></table></div>
<p class="note">La TVA du mois est reversée le mois suivant (régime mensuel). Un crédit de TVA est reporté. L'impôt sur les sociétés n'est pas décaissé dans ce tableau. Les règlements fixés en fin d'année basculent sur l'année suivante.</p></div>`;
return h}

${S.equity.map(e=>`<div class="row" style="justify-content:space-between;align-items:center;margin-top:8px"><span>${esc(e.label)} · ${e0(e.amount)} · ${fdate(e.date)}</span><button class="lnk danger" data-act="del-eq" data-id="${e.id}">Suppr.</button></div>`).join('')}<p class="note">Un apport ou un prêt n'a pas de TVA : HT et TTC sont identiques.</p></div></div>`;

<tr class="strong"><td class="l" colspan="${Y.length+1}">Emplois</td></tr>${L('Investissements','inv')}${L('Besoins de démarrage','dem')}${L('Remboursement d\'emprunts','cap')}${L('Variation du besoin en fonds de roulement','dB')}${L('Total des emplois','emp',1)}
<tr class="strong"><td class="l" colspan="${Y.length+1}">Ressources</td></tr>${L('Capacité d\'autofinancement','caf')}${L('Apports et subventions','eq')}${L('Emprunts','lo')}${L('Total des ressources','res',1)}

const fy=S.loans.flatMap(l=>sched(l).map(r=>({...r,l:l.label})));

const tot=Y.map(y=>dotYear(y));let cum=P();const cu=tot.map(t=>cum=padd(cum,t));const acq=A.reduce((a,x)=>padd(a,P(x.e.ht,tt(x.e))),P());

${A.map(({e,p})=>`<tr><td class="l">${esc(e.label)}<br><span class="chip">${e.cat} · ${fdate(e.date)}</span>${tags}</td><td>${dual(P(e.ht,tt(e)),n0)}</td><td class="num">${e.dur} ans<br>${e.mode==='deg'?'dégressif':'linéaire'}</td>${Y.map(y=>`<td>${dual(P(p[y]||0,(p[y]||0)*k(e)))}</td>`).join('')}</tr>`).join('')}

function viewObj(){const y=S.settings.year,c=srCalc(),g=S.goal,st=S.settings;

const mo=Array(12).fill(0),moT=Array(12).fill(0);S.entries.forEach(e=>{if(e.kind==='vente'&&+e.date.slice(0,4)===y){const i=dparts(e.date)[1]-1;mo[i]+=e.ht;moT[i]+=tt(e)}});
const real=P(sum(mo),sum(moT)),pct=Q.h>0?real.h/Q.h*100:0;
h+=`<div class="grid">${kpi('Chiffre d\'affaires à réaliser',Q,'Par an')}${kpi('Par mois',per(12))}${kpi('Par semaine',per(52))}${kpi('Par jour d\'ouverture',per(days))}</div>`;
if(bk>0)h+=`<div class="card"><h2>Nombre de ventes nécessaires</h2><p style="margin:0">Panier moyen <b class="num" style="color:var(--ht)">${e2(bk)} HT</b> · <b class="num" style="color:var(--ttc)">${e2(bk*c.kv)} TTC</b></p><p>Soit <b>${n0(Math.ceil(Q.h/bk))}</b> ventes par an, <b>${n0(Math.ceil(Q.h/bk/12))}</b> par mois, <b>${n2(Q.h/bk/days)}</b> par jour d'ouverture.</p></div>`;
h+=`<div class="card"><h2>Ventes saisies face à l'objectif ${y}</h2><div class="bar" role="img" aria-label="${n0(pct)} % de l'objectif"><div style="width:${Math.min(100,pct)}%"></div></div><p class="note">${n0(pct)} % de l'objectif annuel : ${e0(real.h)} HT, ${e0(real.t)} TTC. Reste ${e0(Math.max(0,Q.h-real.h))} HT, ${e0(Math.max(0,Q.t-real.t))} TTC.</p>
<div class="scroll"><table class="t wide"><thead><tr><th class="l">€</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead><tbody>
<tr><td class="l">Objectif mensuel${tags}</td>${mo.map(()=>`<td>${dual(per(12))}</td>`).join('')}<td>${dual(Q)}</td></tr>
<tr><td class="l">Ventes saisies${tags}</td>${mo.map((v,i)=>`<td>${dual(P(v,moT[i]))}</td>`).join('')}<td>${dual(real)}</td></tr>
<tr class="strong"><td class="l">Écart${tags}</td>${mo.map((v,i)=>{const p=psub(P(v,moT[i]),per(12));return `<td class="${p.h<0?'neg':''}">${dual(p)}</td>`}).join('')}<td>${dual(psub(real,Q))}</td></tr></tbody></table></div></div>`;

<div class="card"><h2>Données</h2><div class="row"><button data-act="export-json">Télécharger une sauvegarde (JSON)</button><button data-act="load-demo">Recharger les données d'exemple</button><button class="danger" data-act="reset">Tout effacer</button></div><p class="note">Vos données sont enregistrées sur votre compte, privées, ou sur cet appareil si le compte n'est pas disponible.</p></div>`}

/* ===== NAVIGATION ET ÉVÉNEMENTS ===== */
const TABS=[['compta','Comptabilité auto',viewCompta],['seuil','Seuil de rentabilité',viewSR],['tresorerie','Trésorerie',viewTre],['financement','Plan de financement',viewFin],['amortissement','Amortissements',viewAmo],['caf','CAF',viewCaf],['besoins','Besoins',viewBes],['objectif','Objectif de vente',viewObj],['parametres','Paramètres',viewPar]];
function render(){if(!TABS.find(t=>t[0]===tab))tab='compta';const ys=[];for(let y=2024;y<=2034;y++)ys.push(y);
$('#yearSel').innerHTML=ys.map(y=>`<option${y===S.settings.year?' selected':''}>${y}</option>`).join('');$('#coName').value=S.settings.name;
$('#nav').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${k===tab?'on':''}">${l}</a>`).join('');
try{$('#view').innerHTML=TABS.find(t=>t[0]===tab)[2]()}catch(e){$('#view').innerHTML='<div class="card">Une erreur est survenue dans ce module : '+esc(e.message)+'</div>';console.error(e)}}
window.addEventListener('hashchange',()=>{tab=location.hash.slice(1)||'compta';render();scrollTo(0,0)});
const setPath=(o,p,v)=>{const k=p.split('.');let x=o;k.slice(0,-1).forEach(a=>x=x[a]);x[k.at(-1)]=v};
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.bind){let v=t.value;if(t.dataset.num)v=v.trim()===''?'':num(v);setPath(S,t.dataset.bind,v);save();render();return}
if(t.dataset.dr){const d=drafts.entry;d[t.dataset.dr]=t.value;if(t.dataset.dr==='kind'){const c=CATS.find(x=>x.k===d.kind);d.cat=c.a;d.rate=c.r;d.dur=c.dur||3}
if(t.dataset.dr==='cat'){const c=catOf(d.cat);d.rate=c.r;if(c.dur)d.dur=c.dur}
if(d.ht!=='')d.ttc=r2(num(d.ht)*(1+num(d.rate)/100));render()}});
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.draft;if(!p)return;const [o,k]=p.includes('.')?p.split('.'):['entry',p];drafts[o][k]=t.value;
if(o!=='entry')return;const d=drafts.entry;
if(k==='ht'||k==='rate'){d.ttc=d.ht===''?'':r2(num(d.ht)*(1+num(d.rate)/100));const f=$('#f-ttc');if(f)f.value=d.ttc}
if(k==='ttc'){d.ht=t.value===''?'':r2(num(t.value)/(1+num(d.rate)/100));const f=$('#f-ht');if(f)f.value=d.ht}});
function download(name,data){if(!dl){toast('Téléchargement indisponible ici.');return}dl.save({filename:name,data}).catch(()=>{})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
const rm=k=>{S[k]=S[k].filter(x=>x.id!==id)};
if(a==='sub'){ui.sub=b.dataset.v}
else if(a==='kf'){ui.kf=b.dataset.v}
else if(a==='add-entry'){const d=drafts.entry,ht=num(d.ht,NaN);if(!d.date||isNaN(ht)||!d.label.trim()){toast('Renseignez la date, le libellé et un montant.');return}
const base={date:d.date,label:d.label.trim(),kind:d.kind,cat:d.cat,ht,rate:num(d.rate),delay:num(d.delay),dur:Math.max(1,num(d.dur,3)),mode:d.mode};
if(d.editId){const i=S.entries.findIndex(x=>x.id===d.editId);if(i>=0)S.entries[i]={...base,id:d.editId}}
else{const n=Math.max(1,Math.min(60,parseInt(d.rep)||1));for(let i=0;i<n;i++)S.entries.push({...base,id:uid(),date:addMonths(d.date,i)})}
Object.assign(d,{label:'',ht:'',ttc:'',rep:1,editId:null});toast('Pièce enregistrée.')}
else if(a==='edit-entry'){const x=S.entries.find(q=>q.id===id);Object.assign(drafts.entry,x,{ttc:r2(tt(x)),rep:1,editId:id});ui.sub='saisie'}
else if(a==='cancel-edit'){drafts.entry.editId=null;Object.assign(drafts.entry,{label:'',ht:'',ttc:''})}
else if(a==='del-entry')rm('entries');
else if(a==='add-loan'){const d=drafts.loan,am=num(d.amount);if(!d.label.trim()||am<=0){toast('Renseignez le nom et le montant.');return}S.loans.push({id:uid(),label:d.label.trim(),amount:am,rate:num(d.rate),months:Math.max(1,num(d.months,60)),start:d.start,deferred:num(d.deferred)});Object.assign(d,{label:'',amount:''})}
else if(a==='del-loan')rm('loans');
else if(a==='add-eq'){const d=drafts.eq,am=num(d.amount);if(!d.label.trim()||am<=0){toast('Renseignez le nom et le montant.');return}S.equity.push({id:uid(),label:d.label.trim(),type:d.type,amount:am,date:d.date});Object.assign(d,{label:'',amount:''})}
else if(a==='del-eq')rm('equity');
else if(a==='add-need'){const d=drafts.need,h=num(d.ht,NaN);if(!d.label.trim()||isNaN(h)){toast('Renseignez le libellé et le montant HT.');return}S.needs.push({id:uid(),label:d.label.trim(),ht:h,rate:num(d.rate)});Object.assign(d,{label:'',ht:''})}
else if(a==='del-need')rm('needs');
else if(a==='clear-demo'){const s=emptyState();s.settings.year=new Date().getFullYear();s.settings.name='Mon entreprise';S=s}
else if(a==='load-demo'){S=demoState()}
else if(a==='reset'){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmer : tout effacer';return}const s=emptyState();S=s}
else if(a==='export-json'){download('compta-pilote-sauvegarde.json',JSON.stringify(S,null,2));return}
else if(a==='export-journal'){const y=S.settings.year,L=journal(y);download('journal-'+y+'.csv','﻿'+'Date;Journal;Compte;Intitulé;Libellé;Débit;Crédit\n'+L.map(l=>[l.date,l.j,l.a,accName(l.a),'"'+l.label.replace(/"/g,'""')+'"',n2(l.d),n2(l.c)].join(';')).join('\n'));return}
else return;
save();render()});

/* démarrage */
try{const raw=localStorage.getItem(KEY);S=raw?Object.assign(emptyState(),JSON.parse(raw)):demoState()}catch(e){S=demoState()}
render();
(async()=>{try{const [db,user,d]=await Promise.all([window.claude?.use('db'),window.claude?.use('user'),window.claude?.use('downloads')]);dl=d||null;
const id=user?await user.id():null;if(db&&id){dbDoc=db.collection('data/users/'+id).doc('compta');const snap=await dbDoc.get();
if(snap.exists&&!ui.dirty){S=Object.assign(emptyState(),snap.data());render()}setSave('Enregistré sur votre compte (privé)')}else setSave(localStorage.getItem(KEY)?'Enregistré sur cet appareil':'')}catch(e){}})();
})();
</script>

</body></html>
